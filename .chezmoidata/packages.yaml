      - 'tmuxinator'
      - 'watch'
      - 'watchexec'
      - 'wget'
      - 'yazi'
      - 'yq'
      - 'zoxide'
    npm:
      - 'yarn'
      # lsp
      - 'intelephense'
      - 'marksman'
      - 'vscode-langservers-extracted'
      # lint & format
      - 'prettier'
      - '@fsouza/prettierd'
      - 'eslint_d'
