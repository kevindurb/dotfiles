---
# Declarative package lists.
#
# Installed by run_onchange_install-packages.sh.tmpl, which re-runs whenever
# this file changes.
#
#   common  - installed on every machine
#   darwin  - macOS only
#   linux   - Linux only
packages:
  common:
    brew:
      # runtimes
      - 'bash'
      - 'fish'
      # package managers
      - 'antidote'
      - 'fisher'
      - 'pipx'
      - 'uv'
      # lsp
      - 'ansible-language-server'
      - 'bash-language-server'
      - 'dockerfile-language-server'
      - 'fish-lsp'
      - 'lua-language-server'
      - 'sql-language-server'
      - 'typescript-language-server'
      - 'yaml-language-server'
      # lint & format
      - 'ansible-lint'
      - 'shellcheck'
      - 'sqlfluff'
      - 'stylua'
      - 'taplo'
      - 'yamlfmt'
      - 'yamllint'
      # ...but better
      - 'bat'
      - 'duf'
      - 'entr'
      - 'eza'
      - 'htop'
      - 'ncdu'
      - 'prettyping'
      # tuis
      - 'lazygit'
      - 'litecli'
      - 'mycli'
      - 'pgcli'
      # k8s
      - 'argocd'
      - 'helm'
      - 'k9s'
      - 'krew'
      - 'kustomize'
      # neovim
      - 'neovim'
      - 'tree-sitter-cli'
      - 'utftex'
      # AI
      - 'ast-grep'
      - 'ollama'
      - 'opencode'
      - 'pi-coding-agent'
      # other
      - 'ansible'
      - 'arl/arl/gitmux'
      - 'bottom'
      - 'chezmoi'
      - 'cmake'
      - 'cmatrix'
      - 'coreutils'
      - 'cowsay'
      - 'crane'
      - 'curl'
      - 'difftastic'
      - 'direnv'
      - 'exiftool'
      - 'fastfetch'
      - 'figlet'
      - 'fx'
      - 'fzf'
      - 'gd'
      - 'gh'
      - 'git'
      - 'git-delta'
      - 'git-extras'
      - 'git-lfs'
      - 'glow'
      - 'gnupg'
      - 'gnutls'
      - 'gum'
      - 'jq'
      - 'just'
      - 'lolcat'
      - 'mariadb'
