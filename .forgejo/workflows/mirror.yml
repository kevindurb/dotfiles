name: mirror

on:
  push:
    branches: ['**']
    tags: ['**']
  schedule:
    # self-healing: re-sync even if a push-triggered run was missed
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute the ref diff and log it without pushing
        required: false
        type: boolean
        default: true

jobs:
  mirror:
    runs-on: [self-hosted, linux]
    steps:
      - name: Resolve push intent
        id: opts
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          case "$DRY" in
            true|True|1|yes) echo "push=false" >> "${FORGEJO_OUTPUT:-$GITHUB_OUTPUT}" ;;
            *)               echo "push=true"  >> "${FORGEJO_OUTPUT:-$GITHUB_OUTPUT}" ;;
          esac
          echo "push=$( [ "$DRY" = "true" ] && echo false || echo true ) (dry_run input='$DRY')"

      - name: Fetch all branches and tags from forgejo
        run: |
          set -euo pipefail
          HOST_PATH="${{ github.server_url }}"
          HOST_PATH="${HOST_PATH#http://}"
          HOST_PATH="${HOST_PATH#https://}"
          SRC="https://x-access-token:$GITHUB_TOKEN@${HOST_PATH}/${{ github.repository }}.git"
          rm -rf /tmp/mirror.git
          git init --bare --quiet /tmp/mirror.git
          git -C /tmp/mirror.git fetch --prune "$SRC" \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'

      - name: Mint GitHub App installation token (openssl + curl)
        id: app-token
        env:
          CLIENT_ID: ${{ secrets.MIRROR_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          NOW=$(date +%s)
          HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          PAYLOAD=$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' "$((NOW-30))" "$((NOW+540))" "$CLIENT_ID" | b64url)
          printf '%s.%s' "$HEADER" "$PAYLOAD" > /tmp/jwt-head
          printf '%s' "$PRIVATE_KEY" > /tmp/app.pem
          SIG=$(openssl dgst -sha256 -sign /tmp/app.pem /tmp/jwt-head | b64url)
          JWT="$(cat /tmp/jwt-head).$SIG"
          rm -f /tmp/app.pem /tmp/jwt-head
          # discover the (single) installation for this account
          INST=$(curl -sf -H "Authorization: Bearer $JWT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations" | jq -r '.[0].id')
          TOKEN=$(curl -sf -X POST -H "Authorization: Bearer $JWT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/$INST/access_tokens" | jq -r '.token')
          rm -f /tmp/jwt-head
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then echo "::error::failed to mint installation token"; exit 1; fi
          OUT="${FORGEJO_OUTPUT:-$GITHUB_OUTPUT}"
          echo "token=$TOKEN" >> "$OUT"
          echo "installation $INST minted a token (not shown)"

      - name: Check target repository exists
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          TARGET="${{ github.repository }}"
          CODE=$(curl -s -o /tmp/repo-check.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$TARGET")
          if [ "$CODE" != "200" ]; then
            echo "::error::GitHub repo '$TARGET' not found or not visible (HTTP $CODE)."
            echo "::error::Create it first (private, same name), then re-run."
            exit 1
          fi
          echo "Target $TARGET OK"

      - name: Compute ref diff
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          GH="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git ls-remote "$GH" 'refs/heads/*' 'refs/tags/*' | sed 's/\t/ /' | sort > /tmp/gh.refs || true
          git ls-remote /tmp/mirror.git 'refs/heads/*' 'refs/tags/*' | sed 's/\t/ /' | sort > /tmp/src.refs
          echo "--- refs differing or missing on GitHub ---"
          diff /tmp/gh.refs /tmp/src.refs || true

      - name: Push mirror (branches and tags, never deletes)
        if: steps.opts.outputs.push == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          GH="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git -C /tmp/mirror.git push --force "$GH" \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'

      - name: Verify mirror matches source
        if: steps.opts.outputs.push == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          GH="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git ls-remote "$GH" 'refs/heads/*' 'refs/tags/*' | sed 's/\t/ /' | sort > /tmp/gh2.refs
          git ls-remote /tmp/mirror.git 'refs/heads/*' 'refs/tags/*' | sed 's/\t/ /' | sort > /tmp/src2.refs
          if ! diff -q /tmp/gh2.refs /tmp/src2.refs >/dev/null; then
            echo "::error::Mirror verification failed; ref mismatch after push:"
            diff /tmp/gh2.refs /tmp/src2.refs || true
            exit 1
          fi
          echo "Mirror verified: GitHub refs identical to forgejo."
