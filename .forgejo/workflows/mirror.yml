name: mirror

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute the ref diff and log it without pushing
        required: false
        type: boolean
        default: true

jobs:
  mirror:
    runs-on: [self-hosted, linux]
    steps:
      - name: Probe secret availability
        env:
          CID: ${{ secrets.MIRROR_APP_CLIENT_ID }}
          PEM: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
        run: |
          echo "cid length: ${#CID}"
          echo "pem bytes: ${#PEM}"
