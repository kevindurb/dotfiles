name: mirror

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute the ref diff and log it without pushing
        required: false
        type: boolean
        default: true

jobs:
  mirror:
    runs-on: [self-hosted, linux]
    steps:
      - name: Mint token via action
        id: app-token
        uses: https://github.com/actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.MIRROR_APP_CLIENT_ID }}
          private-key: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
      - name: Report token shape
        run: echo "token length ${#APP_TOKEN}"
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
