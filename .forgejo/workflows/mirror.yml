name: mirror

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute the ref diff and log it without pushing
        required: false
        type: boolean
        default: true

jobs:
  mirror:
    runs-on: [self-hosted, linux]
    steps:
      - name: Guarded step
        if: ${{ ! github.event.inputs.dry_run }}
        run: echo guarded-step-ran
      - name: Plain step
        run: echo plain-step-ran
