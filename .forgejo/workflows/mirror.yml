name: mirror

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute the ref diff and log it without pushing
        required: false
        type: boolean
        default: true

jobs:
  mirror:
    uses: ./.forgejo/workflows/mirror-reusable.yml
    secrets: inherit
    with:
      dry-run: ${{ github.event.inputs.dry_run || false }}
