name: mirror

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute the ref diff and log it without pushing
        required: false
        type: boolean
        default: true

jobs:
  mirror:
    runs-on: [self-hosted, linux]
    steps:
      - name: Probe secret availability
        env:
          CID: ${{ secrets.MIRROR_APP_CLIENT_ID }}
          PEM: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
        run: |
          echo "client id length: ${#CID}"
          echo "pem bytes: ${#PEM}"
          echo "server: ${{ github.server_url }}"
      - name: Mint token via action
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.MIRROR_APP_CLIENT_ID }}
          private-key: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
      - name: Show mint result shape (not the token)
        env:
          T: ${{ steps.app-token.outputs.token }}
        run: |
          echo "token length: ${#T}"
