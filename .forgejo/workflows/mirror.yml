name: mirror

on:
  push:
    branches: ['**']
    tags: ['**']
  schedule:
    # self-healing: re-sync even if a push-triggered run was missed
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute the ref diff and log it without pushing
        required: false
        type: boolean
        default: true

jobs:
  mirror:
    runs-on: [self-hosted, linux]
    steps:
      - name: Mirror to GitHub
        uses: https://forgejo.beaver-cloud.ts.net/kevindurb/gh-mirror@main
        with:
          app_client_id: ${{ secrets.MIRROR_APP_CLIENT_ID }}
          app_private_key: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          dry_run: ${{ github.event.inputs.dry_run || 'false' }}
