# tmux plugins, managed as git repositories.
#
# chezmoi clones each repo on first apply, then pulls updates at most once
# every 168h (weekly). Force a refresh with:
#   chezmoi apply --refresh-externals

[".config/tmux/plugins/tmux-sensible"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tmux-sensible"
    pull = { args = ["--ff-only"] }
    refreshPeriod = "168h"

